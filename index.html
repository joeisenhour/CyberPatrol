ght%3D%221%22%20fill%3D%22%232a1410%22%2F%3E%20%3Crect%20x%3D%2215%22%20y%3D%229%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%232a1410%22%2F%3E%20%3Crect%20x%3D%220%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%232a1410%22%2F%3E%20%3Crect%20x%3D%2215%22%20y%3D%2210%22%20width%3D%221%22%20height%3D%221%22%20fill%3D%22%232a1410%22%2F%3E%20%3Crect%20x%3D%220%22%20y%3D%2214%22%20width%3D%2216%22%20height%3D%221%22%20fill%3D%22%232a1410%22%2F%3E%20%3Crect%20x%3D%220%22%20y%3D%2215%22%20width%3D%2216%22%20height%3D%221%22%20fill%3D%22%232a1410%22%2F%3E%20%3Crect%20x%3D%223%22%20y%3D%2210%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23121212%22%2F%3E%20%3Crect%20x%3D%2211%22%20y%3D%2210%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23121212%22%2F%3E%20%3Crect%20x%3D%223%22%20y%3D%2212%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23121212%22%2F%3E%20%3Crect%20x%3D%2211%22%20y%3D%2212%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%23121212%22%2F%3E%20%3Crect%20x%3D%220%22%20y%3D%2211%22%20width%3D%223%22%20height%3D%221%22%20fill%3D%22%238a4a34%22%2F%3E%20%3Crect%20x%3D%225%22%20y%3D%2211%22%20width%3D%226%22%20height%3D%221%22%20fill%3D%22%238a4a34%22%2F%3E%20%3Crect%20x%3D%2213%22%20y%3D%2211%22%20width%3D%223%22%20height%3D%221%22%20fill%3D%22%238a4a34%22%2F%3E%20%3Crect%20x%3D%220%22%20y%3D%2212%22%20width%3D%223%22%20height%3D%221%22%20fill%3D%22%238a4a34%22%2F%3E%20%3Crect%20x%3D%225%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%221%22%20fill%3D%22%238a4a34%22%2F%3E%20%3Crect%20x%3D%2213%22%20y%3D%2212%22%20width%3D%223%22%20height%3D%221%22%20fill%3D%22%238a4a34%22%2F%3E%20%3Crect%20x%3D%223%22%20y%3D%2211%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%239aa0a8%22%2F%3E%20%3Crect%20x%3D%2211%22%20y%3D%2211%22%20width%3D%222%22%20height%3D%221%22%20fill%3D%22%239aa0a8%22%2F%3E%20%3Crect%20x%3D%220%22%20y%3D%2213%22%20width%3D%2216%22%20height%3D%221%22%20fill%3D%22%235a3020%22%2F%3E%20%3C%2Fsvg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: monospace;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #view {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  #pads {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 28%;
    display: none;
    pointer-events: none;
    z-index: 5;
  }
  #pads.on { display: block; }
  .pad {
    position: absolute;
    bottom: 4%;
    width: 18%;
    height: 70%;
    pointer-events: auto;
    border: 2px solid rgba(200, 220, 230, 0.28);
    background: rgba(255, 255, 255, 0.06);
    color: rgba(230, 240, 245, 0.7);
    font: 700 14px/1 monospace;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }
  .pad:active, .pad.held { background: rgba(255,255,255,0.18); }
  #pad-slow { left: 3%; }
  #pad-fast { left: 23%; }
  #pad-jump { right: 23%; }
  #pad-fire { right: 3%; }
</style>
</head>
<body>
  <div id="wrap"><canvas id="view"></canvas></div>
  <div id="pads">
    <div class="pad" id="pad-slow" data-act="slow">SLOW</div>
    <div class="pad" id="pad-fast" data-act="fast">FAST</div>
    <div class="pad" id="pad-jump" data-act="jump">JUMP</div>
    <div class="pad" id="pad-fire" data-act="fire">FIRE</div>
  </div>
<script>
(() => {
  "use strict";

  const IW = 384, IH = 216;
  const GROUND_Y = 168;
  const CP_SPACING = 2200;
  const CP_COUNT = 5; // numbered checkpoints 1-5; the level ends at 5
  const HEAD_AFTER = Math.round(CP_SPACING * 0.4); // face appears once, early in section 1
  const MAX_LIVES = 3;

  /* -------- AUDIO -------- */
  // Master was 0.2; 0.42 is just over 2x linear (~+6.4 dB, about 2x perceived).
  // Music bus is 0.9 so the loop is clearly audible, still a bit under SFX peaks
  // (shoot 0.08 / explode 0.28 into master vs lead ~0.07 * 0.9).
  // A compressor-limiter on the output catches stacked peaks.
  const AUDIO = {
    MASTER: 0.42,
    MUSIC_BUS: 0.9
  };

  /* -------- DIFFICULTY -------- */
  // 1.0 would be the original tune. These values make the game ~10% easier:
  // fewer/slower enemies and shots, more space between obstacles, more
  // checkpoint time, slightly more forgiving hurt boxes and slightly larger
  // shot targets. Jump physics, art, levels, and the once-per-level face
  // are unchanged.
  const DIFFICULTY = {
    ENEMY_DENSITY: 0.90,     // wave cooldown / extra-ship chance (lower = fewer)
    ENEMY_SPEED: 0.90,       // airborne enemy horizontal speed
    SHOT_RATE: 0.90,         // enemy fire frequency (lower = slower)
    SHOT_SPEED: 0.90,        // bomb / fireball speed and fall gravity
    OBSTACLE_SPACING: 1.10,  // gap between ground obstacles
    TIMER: 1.10,             // checkpoint time budget
    HITBOX_HURT: 0.90,       // player hurt-box size (lower = more forgiving)
    HITBOX_TARGET: 1.10      // enemy / rock / bomb target size for player shots
  };

  const L1_TIME = Math.round(52 * DIFFICULTY.TIMER); // was 52
  const L2_TIME = Math.round(51 * DIFFICULTY.TIMER); // was 51
  const L2_THRUST = Math.round(L2_TIME / 3); // stays ~1/3 of the level-2 budget (was 17)
  const START_TIME = L1_TIME;
  const JUMP_V0 = -2.45;
  const GRAVITY = 0.05;
  const JUMP_APEX = 58.8; // discrete peak of JUMP_V0 / GRAVITY
  const JUMP_CARRY = 0.9; // extra px/frame while airborne, so min-speed jumps still clear
  const FORWARD_SHOT_Y = 6; // px above the vehicle's feet; just above ground, at rock height
  const HEAD_W = 19, HEAD_H = 26;
  const HEAD_MOUTH_X = 0.59, HEAD_MOUTH_Y = 0.69;


  const C = {
    sky: "#000000",
    star: ["#ffffff", "#b8c4d8", "#6a7a98", "#3a4860"],
    far: "#2a1410",
    farHi: "#3c1e18",
    mid: "#3e1c16",
    midHi: "#542820",
    near: "#4e261a",
    nearHi: "#6a3422",
    city: "#1a0c0a",
    cityWin: ["#c8a24a", "#7ec8d8", "#d87840"],
    ground: ["#8a4a34", "#6e3c28", "#5a3020", "#4a2418", "#341810", "#2a1410"],
    lip: "#a0583c",
    crater: "#1a0c0a",
    craterWall: "#4a241c",
    steelHi: "#e8eaee",
    steel: "#b0b6bc",
    steelMid: "#8a9098",
    steelLo: "#5a6068",
    steelDk: "#2c3036",
    window: "#141c28",
    windowHi: "#2a3a50",
    light: "#d8f2ff",
    lightHot: "#ffffff",
    tail: "#c82828",
    tailDim: "#6a1818",
    tire: "#121212",
    clad: "#101214",
    rim: "#c4c8ce",
    rimHi: "#eceef2",
    hub: "#9aa0a8",
    shot: "#fff4a0",
    shot2: "#ffffff",
    ufo: "#7a8a6a",
    ufoDk: "#2a3a28",
    ufoHi: "#c8d8a0",
    ufoLite: "#f0f060",
    rock: ["#5a3020", "#3a1c14", "#20100c", "#72402c"],
    hud: "#e8e0c8",
    hudDim: "#8a8470",
    accent: "#7ec8d8",
    warning: "#f0c040",
    danger: "#e05040",
    shadow: "#000000",
    ano: "#f2f4f6",
    anoMid: "#d8dce2",
    anoLo: "#a8b0b8",
    anoDk: "#6a7278",
    goldGlass: "#2e2010",
    goldHi: "#8a6840",
    goldRim: "#c49a5a",
    skirt: "#101214",
    marker: "#d06020",
    puff: "#f4f6f8",
    puffDim: "#c8d0d8"
  };

  const PAL_L1 = { far: "#2a1410", farHi: "#3c1e18", mid: "#3e1c16", midHi: "#542820", near: "#4e261a", nearHi: "#6a3422", city: "#1a0c0a", haze: "#1a0e0c", band: "#241410" };
  const PAL_L2 = { far: "#261210", farHi: "#3a1a16", mid: "#3a1a16", midHi: "#4e221c", near: "#4a2218", nearHi: "#62301e", city: "#160a08", haze: "#180c0a", band: "#20120e" };

  const game = document.createElement("canvas");
  game.width = IW;
  game.height = IH;
  const ctx = game.getContext("2d", { alpha: false });
  const view = document.getElementById("view");
  const vctx = view.getContext("2d", { alpha: false });
  view.addEventListener("pointerdown", () => {
    unlockAudio();
    pointerStartLatch = true;
  });

  let viewScale = 1;

  function layout() {
    const ww = window.innerWidth, wh = window.innerHeight;
    let scale = Math.min(ww / IW, wh / IH);
    const intScale = Math.max(1, Math.floor(scale + 1e-9));
    if (intScale * IW <= ww && intScale * IH <= wh) scale = intScale;
    viewScale = scale;
    const dw = Math.round(IW * scale);
    const dh = Math.round(IH * scale);
    if (view.width !== dw || view.height !== dh) {
      view.width = dw;
      view.height = dh;
    }
    view.style.width = dw + "px";
    view.style.height = dh + "px";
    vctx.imageSmoothingEnabled = false;
  }
  window.addEventListener("resize", layout);
  layout();

  /* ---------------- input ---------------- */
  const keys = Object.create(null);
  const latch = new Set();
  const pads = { slow: false, fast: false, jump: false, fire: false, start: false, thrust: false };
  let pointerStartLatch = false;
  const input = { slow: false, fast: false, jump: false, jumpPress: false, fire: false, firePress: false, startPress: false, mutePress: false, pausePress: false, thrustPress: false, level2Press: false, endingPress: false };
  let prevJump = false, prevFire = false, prevStart = false, prevMute = false, prevPause = false, prevThrust = false, prevLevel2 = false, prevEnding = false;

  const jumpSet = new Set(["arrowup", "up", "w", " ", "space", "spacebar"]);
  const fireSet = new Set(["z", "x", "f", "control", "ctrl", "shift", "j"]);
  const startSet = new Set(["enter", "return"]);
  const slowSet = new Set(["arrowleft", "left", "a"]);
  const fastSet = new Set(["arrowright", "right", "d"]);
  const thrustSet = new Set(["t", "arrowdown", "down"]);

  function keyName(e) {
    const k = (e.key || "").toLowerCase();
    if (k === " ") return " ";
    return k;
  }
  function unlockAudio() { if (typeof SFX !== "undefined") SFX.unlock(); }
  window.addEventListener("keydown", (e) => {
    const k = keyName(e);
    if (!keys[k]) latch.add(k);
    keys[k] = true;
    unlockAudio();
    if (["arrowup","arrowdown","arrowleft","arrowright"," ","space"].includes(k) || fireSet.has(k) || startSet.has(k)) e.preventDefault();
  });
  window.addEventListener("pointerdown", unlockAudio, { passive: true });
  window.addEventListener("pointerup", unlockAudio, { passive: true });
  window.addEventListener("click", unlockAudio);
  window.addEventListener("touchstart", unlockAudio, { passive: true });
  window.addEventListener("touchend", unlockAudio, { passive: true });
  window.addEventListener("keyup", (e) => {
    keys[keyName(e)] = false;
  });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

  const padEls = document.getElementById("pads");
  function bindPad(el, act) {
    const on = (ev) => { ev.preventDefault(); pads[act] = true; el.classList.add("held"); };
    const off = (ev) => { ev.preventDefault(); pads[act] = false; el.classList.remove("held"); };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("pointercancel", off);
  }
  document.querySelectorAll(".pad").forEach((el) => bindPad(el, el.dataset.act));
  window.addEventListener("touchstart", () => { padEls.classList.add("on"); }, { once: true, passive: true });

  function pollGamepad() {
    const list = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (let i = 0; i < list.length; i++) if (list[i]) { gp = list[i]; break; }
    if (!gp) return;
    const ax = gp.axes[0] || 0;
    const b = gp.buttons;
    const pressed = (i) => b[i] && (b[i].pressed || b[i].value > 0.4);
    if (ax < -0.35 || pressed(14)) pads.slow = true;
    if (ax > 0.35 || pressed(15)) pads.fast = true;
    if (pressed(0) || pressed(12)) pads.jump = true;
    if (pressed(1) || pressed(2) || pressed(5) || pressed(7)) pads.fire = true;
    if (pressed(9) || pressed(8)) pads.start = true;
    if (pressed(3) || pressed(13)) pads.thrust = true; // Y button or d-pad down
  }

  function anyDown(set) {
    for (const k of set) if (keys[k]) return true;
    return false;
  }
  function anyLatch(set) {
    for (const k of set) if (latch.has(k)) return true;
    return false;
  }

  function collectInput() {
    pads.slow = pads.fast = pads.jump = pads.fire = pads.start = pads.thrust = false;
    document.querySelectorAll(".pad.held").forEach((el) => { pads[el.dataset.act] = true; });
    pollGamepad();
    const jumpDown = anyDown(jumpSet) || pads.jump;
    const fireDown = anyDown(fireSet) || pads.fire;
    const startDown = anyDown(startSet) || pads.start;
    const muteDown = !!keys["m"];
    const pauseDown = !!keys["p"] || !!keys["escape"];
    input.slow = anyDown(slowSet) || pads.slow;
    input.fast = anyDown(fastSet) || pads.fast;
    input.jump = jumpDown;
    input.jumpPress = (jumpDown && !prevJump) || anyLatch(jumpSet);

      xs.sort((u, v) => u - v);
      for (let i = 0; i + 1 < xs.length; i += 2) {

  const enemyHeadImg = new Image();
  let enemyHeadReady = false;
  enemyHeadImg.onload = function () { enemyHeadReady = true; };
  enemyHeadImg.src = ENEMY_HEAD_SRC;

  function destIndex() {
    return destPoint - 1;
  }

  function difficulty() {
    // Ramp across the 5 sections (and slightly with distance); L2 starts a bit harder.
    const sect = destIndex() / Math.max(1, CP_COUNT - 1);
    const path = worldX / (CP_SPACING * CP_COUNT);
    return Math.min(1, path * 0.35 + sect * 0.45 + (level === 2 ? 0.22 : 0));
  }

  function groundYAt(wx) {
    let y = GROUND_Y;
    for (let i = 0; i < craters.length; i++) {
      const c = craters[i];
      const d = wx - c.x;
      const h = c.w * 0.5;
      if (d > -h && d < h) {
        const t = d / h;
        const bowl = 1 - t * t;
        const cy = GROUND_Y + c.depth * bowl;
        if (cy > y) y = cy;
      }
    }
    return y;
  }

  function spawnCrater(x, w, d) {
    craters.push({ x, w: w || 36, depth: d || (10 + Math.random() * 8) });
  }
  function spawnRock(x, kind) {
    rocks.push({ x, kind: kind || (Math.random() < 0.3 ? 1 : 0), live: true, w: 0, h: 0 });
    const r = rocks[rocks.length - 1];
    r.w = r.kind ? 14 : 10;
    r.h = r.kind ? 12 : 8;
  }
  function spawnUfo(pattern, kind) {
    const d = difficulty();
    const isHead = kind === "head";
    ufos.push({
      x: worldX + IW + 10,
      y: 28 + Math.random() * 50,
      vx: -(0.6 + Math.random() * 0.5 + d * 0.3) * DIFFICULTY.ENEMY_SPEED,
      vy: 0,
      phase: Math.random() * Math.PI * 2,
      pattern: pattern || 0,
      kind: isHead ? "head" : "ship",
      hp: 1,
      live: true,
      bombCd: (50 + Math.random() * 80) / DIFFICULTY.SHOT_RATE,
      w: isHead ? HEAD_W : 16,
      h: isHead ? HEAD_H : 8
    });
  }
  function spawnCheckpoint(x, n) {
    checkpoints.push({ x, n, got: false });
  }

  function burst(x, y, color, n, speed, life) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * (speed || 2.2);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - Math.random() * 0.8,
        life: (life || 28) * (0.5 + Math.random()),
        max: life || 28,
        color,
        size: Math.random() < 0.3 ? 2 : 1,
        g: 0.08
      });
    }
  }

  function resetCourse(keepScore) {
    if (!keepScore) {
      score = 0;
      lives = MAX_LIVES;
    }
    worldX = 0;
    timeLeft = (level === 2 ? L2_TIME : L1_TIME);
    destPoint = 1;
    thrustOn = false;
    thrustTime = (level === 2 ? L2_THRUST : 0);
    lastCheckpoint = 0;
    genX = 280;
    craters = [];
    rocks = [];
    ufos = [];
    bombs = [];
    bullets = [];
    particles = [];
    checkpoints = [];
    flash = 0;
    shake = 0;
    hintTimer = 240;
    thrustHintTimer = (level === 2 ? 240 : 0);
    headSpawned = false;
    player.sx = 72;
    player.speed = player.defaultSpeed;
    player.jumpV = 0;
    player.air = 0;
    player.onGround = true;
    player.fireCd = 0;
    player.invuln = 0;
    player.live = true;
    player.frontS = player.rearS = 0;
    player.frontSV = player.rearSV = 0;
    player.pitch = 0;
    player.muzzle = 0;
    for (let i = 0; i < CP_COUNT; i++) spawnCheckpoint(CP_SPACING * (i + 1), i + 1);
    generateUntil(worldX + IW + 400);
  }

  function generateUntil(target) {
    const d = difficulty();
    while (genX < target) {
      const nextCp = Math.ceil((genX + 1) / CP_SPACING) * CP_SPACING;
      if (Math.abs(nextCp - genX) < 200) {
        genX += 40;
        continue;
      }
      const gap = (70 + Math.random() * (110 - d * 40) + 20) * DIFFICULTY.OBSTACLE_SPACING;
      genX += gap;
      if (genX > target + 80) break;
      if (genX + 80 > nextCp && genX < nextCp + 80) continue;
      const r = Math.random();
      if (r < 0.34) {
        const w = 28 + Math.random() * (18 + d * 22);
        spawnCrater(genX, w, 11 + Math.random() * 9);
        genX += (w * 0.5 + 10) * DIFFICULTY.OBSTACLE_SPACING;
      } else if (r < 0.68) {
        spawnRock(genX, Math.random() < d * 0.5 ? 1 : 0);
        if (d > 0.25 && Math.random() < 0.35) {
          spawnRock(genX + 18 + Math.random() * 16, 0);
        }
        genX += 16 * DIFFICULTY.OBSTACLE_SPACING;
      } else if (r < 0.86) {
        spawnRock(genX, 0);
        const w = 26 + Math.random() * 18;
        spawnCrater(genX + 36 + Math.random() * 20, w, 10 + Math.random() * 8);
        genX += 70 * DIFFICULTY.OBSTACLE_SPACING;
      } else {
        const w1 = 24 + Math.random() * 14;
        spawnCrater(genX, w1, 10 + Math.random() * 7);
        if (d > 0.2) spawnCrater(genX + w1 * 0.5 + 28 + Math.random() * 24, 26 + Math.random() * 16, 10 + Math.random() * 8);
        genX += 80 * DIFFICULTY.OBSTACLE_SPACING;
      }
    }
  }

  function cullWorld() {
    const left = worldX - 80;
    craters = craters.filter((c) => c.x + c.w > left);
    rocks = rocks.filter((r) => r.x + 20 > left && r.live !== "gone");
    checkpoints = checkpoints.filter((c) => c.x + 40 > left || !c.got);
    ufos = ufos.filter((u) => u.live && u.x > worldX - 40 && u.x < worldX + IW + 80);
    bombs = bombs.filter((b) => b.live && b.x > worldX - 20 && b.y < IH + 10);
    bullets = bullets.filter((b) => b.live && b.x > worldX - 4 && b.x < worldX + IW + 8 && b.y > -8 && b.y < IH);
    particles = particles.filter((p) => p.life > 0);
  }

  /* ---------------- cybertruck ---------------- */
  // Sprite is 104 px long x 33 px to the roof peak (L/H = 3.15), traced from the
  // Dimensions.com orthographic side elevation at that pixel grid. The elevation
  // already faces right: pointed nose + light bar on the RIGHT, tall tailgate on
  // the LEFT. Peak is 58/104 = 56% from the rear (44% from the front). The long
  // shallow plane is the sail to the tailgate; the shorter, steeper plane is the
  // hood/windshield. Wheels are 16 px across (~15.4% of length, r = 8).
  // 10% smaller than the original 104x33 / 78x20 sprites, integer-rounded
  // so they stay crisp at 5x. Proportions (wheelbase, peak, arches) kept.
  const VEH_SCALE = 0.9;
  function S(n) { return Math.round(n * VEH_SCALE); }

  const TRUCK_W = S(104);      // 94
  const TRUCK_CX = S(52);      // 47
  const TRUCK_H = S(33);       // 30
  const WHEEL_R = S(8);        // 7
  const FRONT_WX = S(88);      // 79
  const REAR_WX = S(21);       // 19

  const ROADSTER_W = S(78);    // 70
  const ROADSTER_CX = S(39);   // 35
  const ROADSTER_H = S(20);    // 18
  const ROADSTER_FRONT = S(61);// 55
  const ROADSTER_REAR = S(15); // 14
  const ROADSTER_PEAK = S(38); // 34
  const ROADSTER_WR = S(6);    // 5

  function vehW() { return level === 2 ? ROADSTER_W : TRUCK_W; }
  // Shrink the player's hurt box by (1 - HITBOX_HURT) on each side of the original insets.
  function hurtRangeX(insetL, insetR) {
    const px = worldX + player.sx;
    const inner = Math.max(0, vehW() - insetL - insetR);
    const shrink = inner * (1 - DIFFICULTY.HITBOX_HURT) * 0.5;
    return [px + insetL + shrink, px + vehW() - insetR - shrink];
  }
  function vehCX() { return level === 2 ? ROADSTER_CX : TRUCK_CX; }
  function vehFront() { return level === 2 ? ROADSTER_FRONT : FRONT_WX; }
  function vehRear() { return level === 2 ? ROADSTER_REAR : REAR_WX; }
  function vehPeakX() { return level === 2 ? ROADSTER_PEAK : S(58); }
  function vehPeakH() { return level === 2 ? ROADSTER_H : TRUCK_H; }
  function vehNoseH() { return level === 2 ? S(9) : S(16); }

  function truckWorldBox() {
    const gy = GROUND_Y;
    const air = player.air;
    const x0 = worldX + player.sx + S(3);
    const y0 = gy - air - (vehPeakH() - S(5));
    return { x: x0, y: y0, w: vehW() - S(8), h: (vehPeakH() - S(9)) + Math.min(air, 4) };
  }

  function drawWheel(g, cx, cy, spin, compress) {
    // Round tire sitting on the ground, light aero cover and hex hub so the
    // wheel reads as a wheel even at this scale (not a dark box).
    fillCircle(g, cx, cy, WHEEL_R, C.tire);
    fillCircle(g, cx, cy, WHEEL_R - 1, "#1a1c20");
    fillCircle(g, cx, cy, WHEEL_R - 2, "#2a2e34");
    const ro = WHEEL_R - 2.15;
    const ri = 2.3;
    for (let i = 0; i < 6; i++) {
      const mid = spin + i * Math.PI / 3;
      const half = 0.36;
      fillPoly(g, [
        [cx + Math.cos(mid - half) * ro, cy + Math.sin(mid - half) * ro],
        [cx + Math.cos(mid + half) * ro, cy + Math.sin(mid + half) * ro],
        [cx + Math.cos(mid + half * 0.55) * ri, cy + Math.sin(mid + half * 0.55) * ri],
        [cx + Math.cos(mid - half * 0.55) * ri, cy + Math.sin(mid - half * 0.55) * ri]
      ], C.rim);
    }
    const hex = [];
    for (let i = 0; i < 6; i++) {
      const a = spin * 0.5 + i * Math.PI / 3 + Math.PI / 6;
      hex.push([cx + Math.cos(a) * 2.5, cy + Math.sin(a) * 2.5]);
    }
    fillPoly(g, hex, C.hub);
    fillCircle(g, cx, cy, 1.2, C.rimHi);
    if (compress > 1.2) {
      fillRect(g, cx - S(6), cy + WHEEL_R, S(12), 1, "rgba(180,180,180,0.25)");
    }
  }

  function drawCybertruck(g, sx, groundY, opt) {
    // Facing right. Outline snapped to the 104x33 guide raster of the
    // Dimensions.com side elevation (front = right). All fills are original
    // pixel shading; the reference is not copied into the framebuffer.
    const air = opt.air || 0;
    const fs = opt.frontS || 0;
    const rs = opt.rearS || 0;
    const pitch = opt.pitch || 0;
    const muzzle = opt.muzzle || 0;
    const blink = opt.blink;
    const dead = opt.dead;
    if (blink) return;

    const baseY = groundY - air;
    const fcx = sx + FRONT_WX;
    const rcx = sx + REAR_WX;
    const hang = air > 0.4 ? Math.min(1.8, air * 0.08) : 0;
    const fcy = baseY - WHEEL_R - hang + fs * 0.55;
    const rcy = baseY - WHEEL_R - hang + rs * 0.55;

    const spin = worldX * 0.22 + frame * player.speed * 0.14;
    if (!dead) {
      drawWheel(g, fcx, fcy, spin, fs);
      drawWheel(g, rcx, rcy, spin + 0.9, rs);
    }

    const bodyDrop = (fs + rs) * 0.4;
    const pivotX = sx + (FRONT_WX + REAR_WX) * 0.5;
    const pivotY = baseY - S(12) + bodyDrop;
    const by = bodyDrop;
    const R = (pts) => rotPts(pts, pivotX, pivotY, pitch);
    const Y = (h) => baseY - h + by;

    // Main body, rear (left) to nose (right), with trapezoid arch cutouts so
    // the already-drawn round wheels show through. Tailgate nearly vertical
    // at h=25 (76% of peak); nose is a sharp wedge at h=18 (55%).
    const body = [
      [sx + S(0),   Y(S(25))],   // tailgate top
      [sx + S(58),  Y(S(33))],   // roof peak (56% from the rear)
      [sx + S(103), Y(S(18))],   // nose tip / light bar
      [sx + S(103), Y(S(12))],   // front face bottom
      [sx + S(101), Y(S(9))],    // chin
      [sx + S(97),  Y(S(8))],
      // front wheel-arch cutout (wider at the rocker)
      [sx + S(93),  Y(S(17))],
      [sx + S(80),  Y(S(17))],
      [sx + S(76),  Y(S(5))],
      // rocker between the arches
      [sx + S(31),  Y(S(5))],
      // rear wheel-arch cutout
      [sx + S(26),  Y(S(17))],
      [sx + S(15),  Y(S(17))],
      [sx + S(11),  Y(S(7))],
      // rear bumper (stepped valance, lower lip like the elevation)
      [sx + S(8),   Y(S(6))],
      [sx + S(3),   Y(S(7))],
      [sx + S(1),   Y(S(9))],
      [sx + S(0),   Y(S(10))]
    ];

    // Ground shadow only under the chassis (between the wheels) so clearance shows
    if (!dead && air < 8) {
      g.fillStyle = "rgba(0,0,0,0.35)";
      g.fillRect(Math.round(sx + S(32)), Math.round(baseY - 1), S(44), 1);
    }

    fillPoly(g, R(body), C.steel);

    // Upper stainless planes: sail (peak to tail) and hood (peak to nose)
    fillPoly(g, R([
      [sx + S(1),   Y(S(25))],
      [sx + S(58),  Y(S(33))],
      [sx + S(102), Y(S(18))],
      [sx + S(102), Y(S(16))],
      [sx + S(58),  Y(S(22))],
      [sx + S(2),   Y(S(22))]
    ]), C.steelHi);

    // Thin lower body: character line (~h11) down to the cladding (~h8)
    fillPoly(g, R([
      [sx + S(3),   Y(S(11))],
      [sx + S(31),  Y(S(11))],
      [sx + S(31),  Y(S(8))],
      [sx + S(3),   Y(S(8))]
    ]), C.steelLo);
    fillPoly(g, R([
      [sx + S(31),  Y(S(11))],
      [sx + S(76),  Y(S(11))],
      [sx + S(76),  Y(S(8))],
      [sx + S(31),  Y(S(8))]
    ]), C.steelLo);
    fillPoly(g, R([
      [sx + S(97),  Y(S(11))],
      [sx + S(102), Y(S(12))],
      [sx + S(102), Y(S(10))],
      [sx + S(97),  Y(S(10))]
    ]), C.steelLo);

    // Character line
    fillPoly(g, R([
      [sx + S(2),   Y(S(12))],
      [sx + S(31),  Y(S(12))],
      [sx + S(31),  Y(S(11))],
      [sx + S(2),   Y(S(11))]
    ]), C.steelMid);
    fillPoly(g, R([
      [sx + S(31),  Y(S(12))],
      [sx + S(76),  Y(S(12))],
      [sx + S(76),  Y(S(11))],
      [sx + S(31),  Y(S(11))]
    ]), C.steelMid);
    fillPoly(g, R([
      [sx + S(97),  Y(S(12))],
      [sx + S(103), Y(S(13))],
      [sx + S(103), Y(S(12))],
      [sx + S(97),  Y(S(11))]
    ]), C.steelMid);

    // Black rocker cladding (thin strip, character-line-to-rocker stays slim)
    fillPoly(g, R([
      [sx + S(31),  Y(S(8))],
      [sx + S(76),  Y(S(8))],
      [sx + S(76),  Y(S(5))],
      [sx + S(31),  Y(S(5))]
    ]), C.clad);
    // Rear bumper cladding
    fillPoly(g, R([
      [sx + S(0),   Y(S(10))],
      [sx + S(3),   Y(S(7))],
      [sx + S(8),   Y(S(6))],
      [sx + S(11),  Y(S(7))],
      [sx + S(8),   Y(S(7))],
      [sx + S(3),   Y(S(8))],
      [sx + S(1),   Y(S(10))]
    ]), C.clad);
    // Front chin cladding
    fillPoly(g, R([
      [sx + S(97),  Y(S(8))],
      [sx + S(100), Y(S(9))],
      [sx + S(103), Y(S(12))],
      [sx + S(103), Y(S(11))],
      [sx + S(101), Y(S(8))],
      [sx + S(97),  Y(S(7))]
    ]), C.clad);

    // Trapezoid arch cladding — FRAME only, so the round wheel stays visible
    // Rear arch
    fillPoly(g, R([
      [sx + S(11),  Y(S(7))],
      [sx + S(15),  Y(S(17))],
      [sx + S(16),  Y(S(17))],
      [sx + S(13),  Y(S(7))]
    ]), C.clad);
    fillPoly(g, R([
      [sx + S(15),  Y(S(17))],
      [sx + S(26),  Y(S(17))],
      [sx + S(26),  Y(S(16))],
      [sx + S(15),  Y(S(16))]
    ]), C.clad);
    fillPoly(g, R([
      [sx + S(25),  Y(S(17))],
      [sx + S(26),  Y(S(17))],
      [sx + S(32),  Y(S(5))],
      [sx + S(30),  Y(S(5))]
    ]), C.clad);
    // Front arch
    fillPoly(g, R([
      [sx + S(75),  Y(S(5))],
      [sx + S(80),  Y(S(17))],
      [sx + S(81),  Y(S(17))],
      [sx + S(77),  Y(S(5))]
    ]), C.clad);
    fillPoly(g, R([
      [sx + S(80),  Y(S(17))],
      [sx + S(93),  Y(S(17))],
      [sx + S(93),  Y(S(16))],
      [sx + S(80),  Y(S(16))]
    ]), C.clad);
    fillPoly(g, R([
      [sx + S(92),  Y(S(17))],
      [sx + S(93),  Y(S(17))],
      [sx + S(97),  Y(S(8))],
      [sx + S(96),  Y(S(8))]
    ]), C.clad);

    // Windshield on the front slope, ahead of the A-pillar
    fillPoly(g, R([
      [sx + S(77),  Y(S(26))],
      [sx + S(90),  Y(S(22))],
      [sx + S(88),  Y(S(20))],
      [sx + S(77),  Y(S(22))]
    ]), C.window);
    fillPoly(g, R([
      [sx + S(78),  Y(S(25))],
      [sx + S(86),  Y(S(22))],
      [sx + S(85),  Y(S(21))],
      [sx + S(78),  Y(S(23))]
    ]), C.windowHi);

    // Front door window (B- to A-pillar)
    fillPoly(g, R([
      [sx + S(59),  Y(S(31))],
      [sx + S(74),  Y(S(27))],
      [sx + S(74),  Y(S(22))],
      [sx + S(59),  Y(S(22))]
    ]), C.window);

    // Rear door window (C- to B-pillar), under the sail
    fillPoly(g, R([
      [sx + S(37),  Y(S(28))],
      [sx + S(55),  Y(S(31))],
      [sx + S(55),  Y(S(22))],
      [sx + S(37),  Y(S(22))]
    ]), C.window);

    // 1 px roof-edge highlight
    fillPoly(g, R([
      [sx + S(0),   Y(S(25))],
      [sx + S(58),  Y(S(33))],
      [sx + S(58),  Y(S(32))],
      [sx + S(1),   Y(S(24))]
    ]), C.steelHi);
    fillPoly(g, R([
      [sx + S(58),  Y(S(33))],
      [sx + S(103), Y(S(18))],
      [sx + S(102), Y(S(17))],
      [sx + S(58),  Y(S(32))]
    ]), C.steelHi);

    // B-pillar, just behind the peak
    fillPoly(g, R([
      [sx + S(56),  Y(S(32))],
      [sx + S(58),  Y(S(33))],
      [sx + S(58),  Y(S(11))],
      [sx + S(56),  Y(S(11))]
    ]), C.steelLo);

    // C-pillar / cab-bed break
    fillPoly(g, R([
      [sx + S(35),  Y(S(30))],
      [sx + S(37),  Y(S(30))],
      [sx + S(37),  Y(S(11))],
      [sx + S(35),  Y(S(11))]
    ]), C.steelLo);

    // A-pillar, raked with the windshield
    fillPoly(g, R([
      [sx + S(75),  Y(S(27))],
      [sx + S(77),  Y(S(26))],
      [sx + S(77),  Y(S(11))],
      [sx + S(75),  Y(S(11))]
    ]), C.steelLo);

    // Vault / tonneau seam on the bed
    fillPoly(g, R([
      [sx + S(3),   Y(S(24))],
      [sx + S(35),  Y(S(29))],
      [sx + S(35),  Y(S(28))],
      [sx + S(3),   Y(S(23))]
    ]), C.steelMid);
    fillPoly(g, R([
      [sx + S(17),  Y(S(26))],
      [sx + S(18),  Y(S(26))],
      [sx + S(18),  Y(S(18))],
      [sx + S(17),  Y(S(18))]
    ]), C.steelLo);

    // Door handles on the character line
    fillPoly(g, R([
      [sx + S(66),  Y(S(14))],
      [sx + S(70),  Y(S(14))],
      [sx + S(70),  Y(S(13))],
      [sx + S(66),  Y(S(13))]
    ]), C.steelDk);
    fillPoly(g, R([
      [sx + S(44),  Y(S(14))],
      [sx + S(48),  Y(S(14))],
      [sx + S(48),  Y(S(13))],
      [sx + S(44),  Y(S(13))]
    ]), C.steelDk);

    // Front light bar on the leading edge of the wedge
    fillPoly(g, R([
      [sx + S(101), Y(S(18))],
      [sx + S(104), Y(S(18))],
      [sx + S(104), Y(S(14))],
      [sx + S(101), Y(S(14))]
    ]), muzzle ? C.lightHot : C.light);
    fillPoly(g, R([
      [sx + S(103), Y(S(18))],
      [sx + S(104), Y(S(18))],
      [sx + S(104), Y(S(15))],
      [sx + S(103), Y(S(15))]
    ]), C.lightHot);
    if (!dead) {
      fillPoly(g, R([
        [sx + S(104), Y(S(17))],
        [sx + S(105), Y(S(17))],
        [sx + S(105), Y(S(15))],
        [sx + S(104), Y(S(15))]
      ]), muzzle ? C.lightHot : "#8ec8d8");
    }

    // Rear light bar in the tailgate
    fillPoly(g, R([
      [sx + S(0),   Y(S(16))],
      [sx + S(2),   Y(S(16))],
      [sx + S(2),   Y(S(12))],
      [sx + S(0),   Y(S(12))]
    ]), (frame % 20 < 12) ? C.tail : C.tailDim);

    // Side mirror at the A-pillar
    fillPoly(g, R([
      [sx + S(77),  Y(S(20))],
      [sx + S(80),  Y(S(20))],
      [sx + S(80),  Y(S(18))],
      [sx + S(77),  Y(S(18))]
    ]), C.steelLo);

    if (muzzle) {
      fillRect(g, sx + S(104), Y(S(16)), S(5), 2, C.shot2);
      fillRect(g, sx + S(107), Y(S(16)), S(3), 2, C.shot);
      fillRect(g, sx + S(57),  Y(S(34)), 2, S(4), C.shot2);
      fillRect(g, sx + S(56),  Y(S(37)), S(3), S(3), C.shot);
    }

    if (opt.thrust && !dead) {
      const pulse = (frame % 4);
      const jets = [fcx, rcx];
      for (let j = 0; j < jets.length; j++) {
        const jx = Math.round(jets[j] - 1);
        const jy = Math.round(baseY + 1);
        fillRect(g, jx, jy, 2, 2, C.puff);
        fillRect(g, jx, jy + 2, 1, 2 + (pulse % 3), C.puff);
        fillRect(g, jx + 1, jy + 2 + (pulse % 2), 1, 2, C.puffDim);
      }
    }

    if (opt.onGround && player.speed > 0.8 && !dead) {
      if (frame % 2 === 0) {
        particles.push({
          x: worldX + sx + S(14),
          y: groundY - 1,
          vx: -0.4 - Math.random() * 0.5,
          vy: -0.2 - Math.random() * 0.4,
          life: 12 + Math.random() * 8,
          max: 16,
          color: C.ground[2],
          size: 1,
          g: 0.02
        });
      }
    }
  }


  function drawRoadsterWheel(g, cx, cy, spin, compress) {
    const R = ROADSTER_WR;
    fillCircle(g, cx, cy, R, C.tire);
    fillCircle(g, cx, cy, R - 1, "#1a1c20");
    fillCircle(g, cx, cy, R - 1.7, "#3a3e44");
    // five thin star-spokes, light rim tips
    const ro = R - 1.6;
    const ri = 1.3;
    for (let i = 0; i < 5; i++) {
      const mid = spin + i * (Math.PI * 2 / 5) - Math.PI / 2;
      const half = 0.18;
      fillPoly(g, [
        [cx + Math.cos(mid - half) * ro, cy + Math.sin(mid - half) * ro],
        [cx + Math.cos(mid + half) * ro, cy + Math.sin(mid + half) * ro],
        [cx + Math.cos(mid) * ri, cy + Math.sin(mid) * ri]
      ], C.anoMid);
    }
    fillCircle(g, cx, cy, 1.6, "#1c1e22");
    fillCircle(g, cx, cy, 0.7, C.anoLo);
    if (compress > 1.2) {
      fillRect(g, cx - 4, cy + R, 8, 1, "rgba(180,180,180,0.25)");
    }
  }

  function drawRoadster(g, sx, groundY, opt) {
    // Facing right. 78x20 outline from the official Oct 2026 Ano White
    // studio side (photo flipped). Original shading; photo is not copied.
    // Length ~4.3/5.7 of the 104 px Cybertruck; L/H ≈ 3.90 (photo 3.91).
    const air = opt.air || 0;
    const fs = opt.frontS || 0;
    const rs = opt.rearS || 0;
    const pitch = opt.pitch || 0;
    const muzzle = opt.muzzle || 0;
    const blink = opt.blink;
    const dead = opt.dead;
    if (blink) return;

    const baseY = groundY - air;
    const fcx = sx + ROADSTER_FRONT;
    const rcx = sx + ROADSTER_REAR;
    const hang = air > 0.4 ? Math.min(2.2, air * 0.08) : 0;
    const fcy = baseY - ROADSTER_WR - hang + fs * 0.55;
    const rcy = baseY - ROADSTER_WR - hang + rs * 0.55;
    const spin = worldX * 0.22 + frame * player.speed * 0.14;
    if (!dead) {
      drawRoadsterWheel(g, fcx, fcy, spin, fs);
      drawRoadsterWheel(g, rcx, rcy, spin + 1.1, rs);
    }

    const bodyDrop = (fs + rs) * 0.4;
    const pivotX = sx + (ROADSTER_FRONT + ROADSTER_REAR) * 0.5;
    const pivotY = baseY - S(8) + bodyDrop;
    const by = bodyDrop;
    const R = (pts) => rotPts(pts, pivotX, pivotY, pitch);
    const Y = (h) => baseY - h + by;

    const body = [
      [sx + S(1),  Y(S(15))],   // Kamm tail top
      [sx + S(13), Y(S(18))],
      [sx + S(26), Y(S(20))],
      [sx + S(34), Y(S(20))],
      [sx + S(38), Y(S(20))],   // roof peak (~51% from the front)
      [sx + S(47), Y(S(18))],
      [sx + S(57), Y(S(15))],
      [sx + S(65), Y(S(13))],
      [sx + S(73), Y(S(10))],
      [sx + S(76), Y(S(10))],   // top of blunt light-bar face
      [sx + S(78), Y(S(10))],
      [sx + S(78), Y(S(4))],    // hidden light-bar face (nearly vertical)
      [sx + S(79), Y(S(3))],    // black splitter shelf, slight overhang
      [sx + S(71), Y(S(3))],
      // front wheel-arch
      [sx + S(68), Y(S(4))],
      [sx + S(68), Y(S(10))],
      [sx + S(54), Y(S(10))],
      [sx + S(54), Y(S(3))],
      // rocker
      [sx + S(22), Y(S(3))],
      // rear arch
      [sx + S(22), Y(S(10))],
      [sx + S(8),  Y(S(10))],
      [sx + S(8),  Y(S(4))],
      // rear diffuser
      [sx + S(5),  Y(S(4))],
      [sx + S(2),  Y(S(6))],
      [sx + S(1),  Y(S(8))]
    ];

    if (!dead && air < 8) {
      g.fillStyle = "rgba(0,0,0,0.3)";
      g.fillRect(Math.round(sx + S(22)), Math.round(baseY - 1), S(30), 1);
    }

    fillPoly(g, R(body), C.ano);

    // Upper Ano White highlight along the roof / hood
    fillPoly(g, R([
      [sx + S(2),  Y(S(15))],
      [sx + S(38), Y(S(20))],
      [sx + S(76), Y(S(10))],
      [sx + S(76), Y(S(9))],
      [sx + S(38), Y(S(18))],
      [sx + S(3),  Y(S(14))]
    ]), C.ano);

    // a slightly cooler mid-flank
    fillPoly(g, R([
      [sx + S(22), Y(S(9))],
      [sx + S(54), Y(S(9))],
      [sx + S(54), Y(S(5))],
      [sx + S(22), Y(S(5))]
    ]), C.anoMid);

    // Black lower skirt / rocker, rising toward the rear
    fillPoly(g, R([
      [sx + S(22), Y(S(6))],
      [sx + S(54), Y(S(5))],
      [sx + S(54), Y(S(3))],
      [sx + S(22), Y(S(3))]
    ]), C.skirt);
    fillPoly(g, R([
      [sx + S(1),  Y(S(8))],
      [sx + S(8),  Y(S(6))],
      [sx + S(8),  Y(S(4))],
      [sx + S(5),  Y(S(4))],
      [sx + S(2),  Y(S(6))]
    ]), C.skirt);
    fillPoly(g, R([

  // SpaceX Starship upper stage, standing alone (no Super Heavy, no legs, no HLS windows).
  // Proportions from the user photo (H/W 518/90 ≈ 5.76 → sprite 160×28). Original pixel art.
  // Dark-gray charcoal palette; flaps, weld seams, raceway, ports, right hinge stripe.
  function drawStarship(g, x, groundY) {
    const BW = 28;
    const BH = 160;
    const tip = groundY - BH;
    const mid = x + (BW >> 1);
    const R = x + BW;

    const G = {
      hi: "#6a7078",
      lit: "#4a4e54",
      base: "#3a3d42",
      lo: "#2c2f34",
      shade: "#1c1e22",
      seam: "#25282c",
      hinge: "#121416",
      flap: "#32363b",
      flapLo: "#24272c",
      flapHi: "#4a4f55",
      port: "#0c0e10",
      portHi: "#5a6068",
      race: "#3e3a3a",
      raceLo: "#2a2626",
      raceBox: "#4a4444",
      cap: "#2a2c30",
      engine: "#141518",
      engHi: "#2a2c30"
    };

    // rear flaps — angled tops, vertical outboard edges, sit on the surface
    fillPoly(g, [
      [x, tip + 115],
      [x - 10, tip + 134],
      [x - 10, groundY],
      [x, groundY]
    ], G.flap);
    fillPoly(g, [
      [x, tip + 115],
      [x - 3, tip + 122],
      [x - 3, groundY],
      [x, groundY]
    ], G.flapHi);
    fillRect(g, x - 10, tip + 134, 1, groundY - (tip + 134), G.hinge);

    fillPoly(g, [
      [R, tip + 115],
      [R + 11, tip + 134],
      [R + 11, groundY],
      [R, groundY]
    ], G.flapLo);
    fillRect(g, R + 10, tip + 134, 1, groundY - (tip + 134), G.shade);

    // forward flaps — smaller, near the ogive, flat bottoms, swept tops
    fillPoly(g, [
      [x, tip + 20],
      [x - 9, tip + 30],
      [x - 9, tip + 40],
      [x, tip + 40]
    ], G.flap);
    fillRect(g, x - 9, tip + 30, 1, 11, G.hinge);

    fillPoly(g, [
      [R, tip + 20],
      [R + 9, tip + 30],
      [R + 9, tip + 40],
      [R, tip + 40]
    ], G.flapLo);
    fillRect(g, R + 8, tip + 30, 1, 11, G.shade);

    // barrel
    const bodyH = groundY - (tip + 20) - 4;
    fillRect(g, x, tip + 20, BW, bodyH, G.base);
    fillRect(g, x, tip + 20, 8, bodyH, G.lit);
    fillRect(g, R - 7, tip + 20, 7, bodyH, G.lo);
    fillRect(g, R - 4, tip + 20, 4, bodyH, G.shade);

    // ogive nose — row widths from the photo (blunt rounded cap, not a sharp cone)
    const noseHalf = [2, 3, 4, 5, 6, 7, 8, 8, 9, 10, 10, 11, 11, 12, 12, 13, 13, 13, 14, 14, 14];
    for (let dy = 0; dy <= 20; dy++) {
      const hw = noseHalf[dy];
      const y = tip + dy;
      const x0 = mid - hw;
      let w = 2 * hw;
      if (x0 + w > R) w = R - x0;
      if (dy === 0) {
        fillRect(g, mid - 2, y, 5, 1, G.cap);
        fillRect(g, mid - 2, y, 1, 1, G.hi);
        continue;
      }
      fillRect(g, x0, y, w, 1, G.base);
      const litW = Math.max(1, Math.round(hw * 0.55));
      fillRect(g, x0, y, litW, 1, G.lit);
      const shW = Math.max(1, Math.round(hw * 0.45));
      fillRect(g, x0 + w - shW, y, shW, 1, G.lo);
      const hsW = Math.max(1, Math.round(hw * 0.28));
      fillRect(g, x0 + w - hsW, y, hsW, 1, G.shade);
      fillRect(g, x0, y, 1, 1, G.hi);
      if (dy <= 4) fillRect(g, mid - (dy <= 2 ? 2 : 1), y, dy <= 2 ? 4 : 3, 1, G.cap);
    }

    // weld seams (nose rings follow local width)
    fillRect(g, mid - 8, tip + 8, 16, 1, G.seam);
    fillRect(g, mid - 11, tip + 14, 22, 1, G.seam);
    for (let sy = tip + 26; sy < groundY - 6; sy += 6) {
      fillRect(g, x + 1, sy, BW - 2, 1, G.seam);
    }

    // left rim on the barrel (after seams)
    fillRect(g, x, tip + 20, 1, bodyH, G.hi);

    // hinge-line stripe at the right flap roots
    fillRect(g, R - 1, tip + 20, 1, 20, G.hinge);
    fillRect(g, R - 1, tip + 115, 1, groundY - (tip + 115) - 4, G.hinge);
    fillRect(g, x - 1, tip + 20, 1, 21, G.hinge);
    fillRect(g, x - 1, tip + 115, 1, groundY - (tip + 115), G.hinge);

    // raceway, slightly left of center
    const rx = x + 8;
    fillRect(g, rx, tip + 69, 2, groundY - (tip + 69) - 4, G.race);
    fillRect(g, rx, tip + 69, 1, groundY - (tip + 69) - 4, G.raceLo);
    fillRect(g, rx - 1, tip + 67, 4, 5, G.raceBox);
    fillRect(g, rx - 1, tip + 67, 4, 1, G.raceLo);
    fillRect(g, rx - 1, tip + 100, 4, 2, G.raceBox);

    // mid-body ports (two, right of center) and one lower port
    fillRect(g, x + 15, tip + 67, 2, 2, G.port);
    fillRect(g, x + 18, tip + 68, 2, 2, G.port);
    fillRect(g, x + 15, tip + 67, 1, 1, G.portHi);
    fillRect(g, x + 18, tip + 68, 1, 1, G.portHi);
    fillRect(g, x + 18, tip + 128, 2, 2, G.port);
    fillRect(g, x + 18, tip + 128, 1, 1, G.portHi);

    // short engine skirt between the rear flaps, sitting on the surface
    fillRect(g, x + 2, groundY - 4, BW - 4, 4, G.engine);
    fillRect(g, x + 3, groundY - 4, 3, 4, G.engHi);
    fillRect(g, mid - 6, groundY - 2, 3, 2, G.shade);
    fillRect(g, mid - 1, groundY - 2, 3, 2, G.shade);
    fillRect(g, mid + 4, groundY - 2, 3, 2, G.shade);

    fillRect(g, x - 12, groundY, BW + 24, 1, "rgba(0,0,0,0.4)");
  }

  /* ---------------- background ---------------- */
  function noise1(x, seed) {
    const n = Math.sin(x * 0.017 + seed * 19.2) * 43758.5453;
    return n - Math.floor(n);
  }
  function heightField(x, seed, amp, oct) {
    let v = 0, a = 1, s = 0.01, n = 0;
    for (let i = 0; i < oct; i++) {
      const xf = x * s + seed * 10;
      const i0 = Math.floor(xf), f = xf - i0;
      const u = f * f * (3 - 2 * f);
      const h = noise1(i0, seed + i) * (1 - u) + noise1(i0 + 1, seed + i) * u;
      v += h * a;
      n += a;
      a *= 0.5;
      s *= 2;
    }
    return (v / n) * amp;
  }

  function drawMtnLayer(g, px, baseY, amp, color, hi, seed, jagged) {
    const pts = [[IW, IH], [0, IH], [0, baseY]];
    let prev = baseY - heightField(px, seed, amp, 4);
    for (let x = 0; x <= IW; x += 2) {
      let h = heightField(px + x, seed, amp, 4);
      if (jagged && (x + (seed | 0)) % 14 < 3) h += jagged * ((x * 3 + seed) % 5);
      const y = baseY - h;
      pts.push([x, y]);
      prev = y;
    }
    pts.push([IW, baseY]);
    fillPoly(g, pts, color);
    // thin highlight ridgeline
    g.fillStyle = hi;
    for (let x = 0; x <= IW; x += 2) {
      let h = heightField(px + x, seed, amp, 4);
      if (jagged && (x + (seed | 0)) % 14 < 3) h += jagged * ((x * 3 + seed) % 5);
      const y = Math.round(baseY - h);
      g.fillRect(x, y, 2, 1);
    }
  }

  function drawCity(g, px, baseY, cityCol) {
    const city = cityCol || C.city;
    const span = 48;
    const start = -((px % span) + span) % span;
    for (let x = start; x < IW + span; x += span) {
      const id = Math.floor((px + x) / span);
      const h = 10 + (Math.abs(Math.sin(id * 12.989) * 10000) % 28);
      const w = 8 + (id * 7) % 14;
      fillRect(g, x, baseY - h, w, h, city);
      fillPoly(g, [[x, baseY - h], [x + w * 0.5, baseY - h - 4 - (id % 5)], [x + w, baseY - h]], city);
      // windows
      const seed = Math.abs(Math.sin(id * 3.7) * 10000);
      for (let wy = baseY - 4; wy > baseY - h + 2; wy -= 4) {
        for (let wx = x + 2; wx < x + w - 2; wx += 3) {
          if (((wx * 13 + wy * 7 + id * 9) & 3) === 0) {
            fillRect(g, wx, wy - 1, 1, 2, C.cityWin[(id + wx) % 3]);
          }
        }
      }
    }
  }

  function drawStars(g) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.x -= player.speed * s.p;
      if (s.x < -2) s.x += IW + 4;
      const tw = 0.6 + 0.4 * Math.sin(frame * 0.05 + s.tw);
      if (tw < 0.35 && s.s === 1) continue;
      g.fillStyle = s.c;
      g.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s);
    }
  }

  function drawGround(g) {
    for (let x = 0; x < IW; x++) {
      const wx = worldX + x;
      const y = Math.round(groundYAt(wx));
      if (y > GROUND_Y + 1) {
        // crater walls + pit
        g.fillStyle = C.craterWall;
        g.fillRect(x, GROUND_Y, 1, y - GROUND_Y);
        g.fillStyle = C.crater;
        g.fillRect(x, y, 1, IH - y);
        // lip
        if (y <= GROUND_Y + 2) {
          g.fillStyle = C.lip;
          g.fillRect(x, GROUND_Y - 1, 1, 1);
        } else {
          g.fillStyle = C.ground[0];
          g.fillRect(x, y, 1, 1);
        }
        // strata under pit
        g.fillStyle = C.ground[4];
        g.fillRect(x, Math.min(IH, y + 8), 1, IH);
      } else {
        g.fillStyle = C.lip;
        g.fillRect(x, GROUND_Y, 1, 1);
        g.fillStyle = C.ground[0];
        g.fillRect(x, GROUND_Y + 1, 1, 2);
        g.fillStyle = C.ground[1];
        g.fillRect(x, GROUND_Y + 3, 1, 5);
        g.fillStyle = C.ground[2];
        g.fillRect(x, GROUND_Y + 8, 1, 8);
        g.fillStyle = C.ground[3];
        g.fillRect(x, GROUND_Y + 16, 1, 10);
        g.fillStyle = C.ground[4];
        g.fillRect(x, GROUND_Y + 26, 1, 12);
        g.fillStyle = C.ground[5];
        g.fillRect(x, GROUND_Y + 38, 1, IH);
        // sparse surface pebbles
        const n = (Math.sin(wx * 12.9898 + 78.233) * 43758.5453);
        const f = n - Math.floor(n);
        if (f > 0.92) {
          g.fillStyle = C.ground[3];
          g.fillRect(x, GROUND_Y - 1, 1, 1);
        }
      }
    }
  }

  function drawRock(g, r) {
    if (!r.live || r.live === "gone") return;
    const sx = Math.round(r.x - worldX);
    const gy = GROUND_Y;
    if (sx < -20 || sx > IW + 8) return;
    if (r.kind === 1) {
      fillPoly(g, [
        [sx, gy], [sx + 3, gy - 8], [sx + 7, gy - 12], [sx + 12, gy - 7], [sx + 14, gy]
      ], C.rock[1]);
      fillPoly(g, [
        [sx + 3, gy - 8], [sx + 7, gy - 12], [sx + 8, gy - 8], [sx + 5, gy - 6]
      ], C.rock[3]);
      fillPoly(g, [
        [sx, gy], [sx + 4, gy - 3], [sx + 8, gy], [sx, gy]
      ], C.rock[2]);
    } else {
      fillPoly(g, [
        [sx, gy], [sx + 2, gy - 6], [sx + 6, gy - 8], [sx + 10, gy - 4], [sx + 10, gy]
      ], C.rock[0]);
      fillPoly(g, [
        [sx + 2, gy - 6], [sx + 6, gy - 8], [sx + 6, gy - 5], [sx + 3, gy - 4]
      ], C.rock[3]);
      fillRect(g, sx + 1, gy - 2, 7, 2, C.rock[2]);
    }
  }

  function drawUfo(g, u) {
    if (u.kind === "head") return; // photographic head is composited after the 5x present
    const sx = Math.round(u.x - worldX);
    const sy = Math.round(u.y);
    if (sx < -20 || sx > IW + 20) return;
    fillPoly(g, [[sx - 2, sy], [sx + 8, sy - 4], [sx + 18, sy], [sx + 16, sy + 3], [sx, sy + 3]], C.ufoDk);
    fillPoly(g, [[sx, sy], [sx + 8, sy - 3], [sx + 16, sy], [sx + 14, sy + 2], [sx + 2, sy + 2]], C.ufo);
    fillPoly(g, [[sx + 5, sy - 3], [sx + 8, sy - 6], [sx + 11, sy - 3]], C.ufoHi);
    const lit = (frame + (u.phase * 10) | 0) % 8 < 5;
    fillRect(g, sx + 3, sy + 1, 2, 1, lit ? C.ufoLite : C.ufoHi);
    fillRect(g, sx + 7, sy + 1, 2, 1, !lit ? C.ufoLite : C.ufoDk);
    fillRect(g, sx + 11, sy + 1, 2, 1, lit ? C.ufoLite : C.ufoHi);
  }

  function drawHeadsOnView() {
    if (!enemyHeadReady) return;
    if (mode === "title" || mode === "win") return;
    const s = viewScale;
    vctx.imageSmoothingEnabled = true;
    for (let i = 0; i < ufos.length; i++) {
      const u = ufos[i];
      if (!u.live || u.kind !== "head") continue;
      const dx = (u.x - worldX + sceneOx) * s;
      const dy = (u.y + sceneOy) * s;
      const dw = u.w * s, dh = u.h * s;
      if (dx + dw < 0 || dx > view.width) continue;
      vctx.drawImage(enemyHeadImg, dx, dy, dw, dh);
    }
    vctx.imageSmoothingEnabled = false;
  }

  function drawFireball(g, b) {
    const sx = Math.round(b.x - worldX), sy = Math.round(b.y);
    const flick = (frame + Math.floor(b.y) * 3) % 6;
    const trail = flick < 3 ? "#a02808" : "#701808";
    const mid = flick < 3 ? "#f06810" : "#d84808";
    const core = flick < 3 ? "#ffd040" : "#ff9018";
    // small upward trail (falling downward)
    fillRect(g, sx, sy - 7, 2, 5, trail);
    fillRect(g, sx - 1, sy - 5, 4, 4, mid);
    fillRect(g, sx - 3, sy - 3, 7, 7, mid);
    fillRect(g, sx - 2, sy - 2, 5, 5, core);
    fillRect(g, sx - 1, sy - 1, 3, 3, "#fff8d0");
    fillRect(g, sx, sy, 1, 1, "#ffffff");
  }

  function drawCheckpoint(g, c) {
    const sx = Math.round(c.x - worldX);
    if (sx < -16 || sx > IW + 16) return;
    const gy = GROUND_Y;
    fillRect(g, sx, gy - 28, 2, 28, c.got ? C.steelLo : C.accent);
    fillRect(g, sx + 1, gy - 28, 16, 11, c.got ? C.steelDk : "#163040");
    fillRect(g, sx + 1, gy - 28, 16, 1, C.accent);
    drawText(g, String(c.n), sx + 6, gy - 26, c.got ? C.hudDim : C.hud, 1);
  }

  /* ---------------- gameplay ---------------- */
  let ufoSpawnCd = 200 / DIFFICULTY.ENEMY_DENSITY;

  function fireShots() {
    if (player.fireCd > 0 || !player.live) return;
    player.fireCd = 11;
    player.muzzle = 4;
    const originX = worldX + player.sx;
    const air = player.air;
    const by = GROUND_Y - air;
    bullets.push({ x: originX + vehW(), y: by - FORWARD_SHOT_Y, vx: 4.2, vy: 0, live: true, kind: 0 });
    bullets.push({ x: originX + vehPeakX(), y: by - (vehPeakH() + 1) + (player.frontS + player.rearS) * 0.2, vx: player.speed, vy: -3.6, live: true, kind: 1 });
    SFX.shoot();
  }

  function updateSuspension(landed) {
    if (player.onGround) {
      if (landed) {
        player.frontSV += 2.4 + Math.random() * 0.8;
        player.rearSV += 1.8 + Math.random() * 1.1;
        SFX.land();
      }
      // idle shimmy
      const t = frame * 0.15;
      const idleF = Math.sin(t * 1.1) * 0.15;
      const idleR = Math.sin(t * 1.07 + 1.3) * 0.15;
      player.frontSV += -player.frontS * 0.35 + idleF * 0.08;
      player.rearSV += -player.rearS * 0.33 + idleR * 0.08;
    } else {
      // wheels hang slightly
      player.frontSV += (-1.6 - player.frontS) * 0.12;
      player.rearSV += (-1.6 - player.rearS) * 0.12;
    }
    player.frontSV *= 0.72;
    player.rearSV *= 0.72;
    player.frontS += player.frontSV;
    player.rearS += player.rearSV;
    if (player.frontS > 4) player.frontS = 4;
    if (player.rearS > 4) player.rearS = 4;
    if (player.frontS < -2.5) player.frontS = -2.5;
    if (player.rearS < -2.5) player.rearS = -2.5;
    const targetPitch = (player.rearS - player.frontS) * 0.05;
    player.pitch += (targetPitch - player.pitch) * 0.25;
  }

  function killPlayer(cause) {
    if (!player.live || player.invuln > 0) return;
    player.live = false;
    mode = "dying";
    deathTimer = 80;
    shake = 8;
    flash = 6;
    lives -= 1;
    burst(worldX + player.sx + vehCX(), GROUND_Y - player.air - 10, C.steelHi, 22, 3.2, 40);
    burst(worldX + player.sx + vehCX(), GROUND_Y - player.air - 10, C.warning, 12, 2.4, 30);
    burst(worldX + player.sx + vehCX(), GROUND_Y - player.air - 8, C.steelLo, 10, 1.6, 24);
    SFX.death();
    SFX.explode();
  }

  function respawnOrOver() {
    if (lives <= 0) {
      mode = "gameover";
      SFX.gameOver();
      return;
    }
    mode = "playing";
    player.live = true;
    player.jumpV = 0;
    player.air = 0;
    player.onGround = true;
    player.invuln = 120;
    player.frontS = player.rearS = 0;
    if (timeLeft < 18 * DIFFICULTY.TIMER) timeLeft = 22 * DIFFICULTY.TIMER;
    // skip out of a crater if needed
    const wx = worldX + player.sx + vehCX();
    if (groundYAt(wx) > GROUND_Y + 3 || groundYAt(wx + 12) > GROUND_Y + 3 || groundYAt(wx - 12) > GROUND_Y + 3) {
      let dx = 0;
      while (dx < 200 && (groundYAt(worldX + player.sx + vehCX() + dx) > GROUND_Y + 2)) dx += 8;
      worldX += dx;
    }
    // clear very close rocks
    rocks.forEach((r) => {
      if (Math.abs(r.x - (worldX + player.sx + vehCX())) < 40) r.live = false;
    });
  }

  function hitRock(r) {
    r.live = false;
    score += r.kind ? 150 : 100;
    burst(r.x + 5, GROUND_Y - 6, C.rock[3], 14, 2.2, 22);
    SFX.pop();
  }

  function hitUfo(u) {
    u.live = false;
    score += 500;
    const cx = u.x + (u.w >> 1), cy = u.y + (u.h >> 1);
    if (u.kind === "head") {
      burst(cx, cy, "#e8c8a8", 16, 2.4, 26);
      burst(cx, cy, C.warning, 8, 1.8, 18);
    } else {
      burst(cx, cy, C.ufoHi, 16, 2.4, 26);
      burst(cx, cy, C.ufoLite, 8, 1.8, 18);
    }
    SFX.explode();
  }

  function bombImpact(b) {
    b.live = false;
    spawnCrater(b.x, 30 + Math.random() * 10, 11 + Math.random() * 6);
    burst(b.x, GROUND_Y, C.warning, 12, 2, 20);
    burst(b.x, GROUND_Y, C.ground[2], 10, 1.4, 18);
    SFX.bomb();
    SFX.noise(0.15, 0.15, 600);
    // destroy rocks in crater
    rocks.forEach((r) => {
      if (Math.abs(r.x - b.x) < 22) { r.live = false; burst(r.x, GROUND_Y - 4, C.rock[0], 6, 1.5, 14); }
    });
  }

  function updatePlaying() {
    // speed
    if (input.slow) player.speed -= 0.035;
    else if (input.fast) player.speed += 0.035;
    else {
      // gently drift toward default? original stayed where you set it. Keep set speed.
    }
    if (player.speed < player.minSpeed) player.speed = player.minSpeed;
    if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;

    // screen position shifts slightly with speed
    const targetSx = 52 + ((player.speed - player.minSpeed) / (player.maxSpeed - player.minSpeed)) * 44;
    player.sx += (targetSx - player.sx) * 0.08;

    // jump
    if (input.jumpPress && player.onGround && player.live) {
      player.jumpV = JUMP_V0;
      player.onGround = false;
      SFX.jump();
    }
    let landed = false;
    const thrusting = level === 2 && thrustOn && thrustTime > 0 && player.live;
    if (!thrusting && (!player.onGround || player.jumpV < 0)) {
      player.jumpV += GRAVITY;
      player.air -= player.jumpV;
      // air is height above ground; jumpV negative going up, we subtracted so air increases. Wait.
      // Let's define air >= 0 as height in pixels above ground.
      // jumpV is vertical velocity in screen y (positive down).
      // On jump, jumpV = -4.35, air -= jumpV  => air += 4.35. Good if I do air -= jumpV.
      if (player.air <= 0) {
        player.air = 0;
        player.jumpV = 0;
        if (!player.onGround) landed = true;
        player.onGround = true;
      } else {
        player.onGround = false;
      }
    }

    // Level-2 cold-gas thrusters: toggle, rise to and hold jump apex, drain flight time
    if (level === 2 && input.thrustPress && player.live) {
      if (!thrustOn && thrustTime > 0) {
        thrustOn = true;
        thrustHintTimer = 0;
        if (player.onGround) player.jumpV = JUMP_V0;
        if (typeof SFX.thrust === "function") SFX.thrust();
      } else if (thrustOn) {
        thrustOn = false;
        if (player.air > 0) player.jumpV = Math.max(player.jumpV, 0.15);
      }
    }
    if (level === 2 && thrustOn && thrustTime > 0 && player.live) {
      player.onGround = false;
      landed = false;
      if (player.air < JUMP_APEX - 0.4) {
        if (player.jumpV > -2.4) player.jumpV = -2.4;
        player.jumpV += GRAVITY;
        player.air -= player.jumpV;
        if (player.air >= JUMP_APEX) {
          player.air = JUMP_APEX;
          player.jumpV = 0;
        }
      } else {
        player.air = JUMP_APEX;
        player.jumpV = 0;
      }
      thrustTime -= 1 / 60;
      if (thrustTime <= 0) {
        thrustTime = 0;
        thrustOn = false;
        player.jumpV = 0.2;
      }
      if (frame % 2 === 0) spawnThrustPuffs(Math.round(player.sx), GROUND_Y);
    }

    updateSuspension(landed);

    if (input.firePress) fireShots();
    if (player.fireCd > 0) player.fireCd--;
    if (player.muzzle > 0) player.muzzle--;
    if (player.invuln > 0) player.invuln--;

    worldX += player.speed + (!player.onGround && player.live ? JUMP_CARRY : 0);
    generateUntil(worldX + IW + 420);
    score += 0; // distance scored below
    if (frame % 6 === 0) score += 1;

    timeLeft -= 1 / 60;
    if (timeLeft <= 10 && timeLeft > 0) {
      timeWarnTick--;
      if (timeWarnTick <= 0) { SFX.warn(); timeWarnTick = 60; }
    }
    if (timeLeft <= 0) {
      timeLeft = 0;
      killPlayer("time");
    }

    // checkpoints
    for (let i = 0; i < checkpoints.length; i++) {
      const c = checkpoints[i];
      if (!c.got && worldX + player.sx + vehCX() >= c.x) {
        c.got = true;
        const bonus = Math.max(0, Math.floor(timeLeft * 10));
        score += 1000 + bonus;
        lastCheckpoint = c.x;
        if (c.n === CP_COUNT) {
          if (level === 1) {
            SFX.checkpoint();
            beginLevel(2, true);
            return;
          }
          startEnding();
          return;
        }
        destPoint = c.n + 1;
        const budget = (level === 2 ? L2_TIME : L1_TIME);
        timeLeft = Math.max(42, budget - destIndex() * 2);
        SFX.checkpoint();
        burst(c.x + 8, GROUND_Y - 20, C.accent, 16, 2, 24);
      }
    }

    // ufo waves — ships by default; the photo head appears once per level
    ufoSpawnCd--;
    if (ufoSpawnCd <= 0 && worldX > 500) {
      const d = difficulty();
      if (!headSpawned && worldX > HEAD_AFTER) {
        spawnUfo(0, "head");
        headSpawned = true;
      } else {
        spawnUfo(0);
      }
      if (d > 0.35 && Math.random() < 0.4 * DIFFICULTY.ENEMY_DENSITY) spawnUfo(1);
      if (level === 2 && Math.random() < 0.45 * DIFFICULTY.ENEMY_DENSITY) spawnUfo(1);
      ufoSpawnCd = ((level === 2 ? 140 : 180) - d * 70 + Math.random() * 70) / DIFFICULTY.ENEMY_DENSITY;
    }

    // bullets
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      if (!b.live) continue;
      b.x += b.vx;
      b.y += b.vy;
      if (b.y < -4 || b.x > worldX + IW + 6) b.live = false;
    }

    // ufos
    for (let i = 0; i < ufos.length; i++) {
      const u = ufos[i];
      if (!u.live) continue;
      u.phase += 0.05;
      u.x += u.vx + (u.pattern ? Math.sin(u.phase) * 0.3 : 0);
      u.y += Math.sin(u.phase * 1.4) * 0.45;
      if (u.y < 16) u.y = 16;
      if (u.y > GROUND_Y - 50) u.y = GROUND_Y - 50;
      u.bombCd--;
      if (u.bombCd <= 0 && u.x < worldX + IW - 20 && u.x > worldX + 40) {
        if (u.kind === "head") {
          bombs.push({
            x: u.x + u.w * HEAD_MOUTH_X,
            y: u.y + u.h * HEAD_MOUTH_Y,
            vx: -0.1 * DIFFICULTY.SHOT_SPEED, vy: 0.4 * DIFFICULTY.SHOT_SPEED, live: true, kind: "fireball"
          });
        } else {
          bombs.push({ x: u.x + 8, y: u.y + 6, vx: -0.1 * DIFFICULTY.SHOT_SPEED, vy: 0.4 * DIFFICULTY.SHOT_SPEED, live: true, kind: "bomb" });
        }
        u.bombCd = (70 + Math.random() * 90 - difficulty() * 20) / DIFFICULTY.SHOT_RATE;
      }
      // collide bullets
      for (let j = 0; j < bullets.length; j++) {
        const b = bullets[j];
        if (!b.live) continue;
        if (b.x > u.x + 1 - u.w * (DIFFICULTY.HITBOX_TARGET - 1) && b.x < u.x + u.w - 1 + u.w * (DIFFICULTY.HITBOX_TARGET - 1) && b.y > u.y + 1 - u.h * (DIFFICULTY.HITBOX_TARGET - 1) && b.y < u.y + u.h - 1 + u.h * (DIFFICULTY.HITBOX_TARGET - 1)) {
          b.live = false;
          hitUfo(u);
          break;
        }
      }
    }

    // bombs
    for (let i = 0; i < bombs.length; i++) {
      const b = bombs[i];
      if (!b.live) continue;
      b.vy += 0.06 * DIFFICULTY.SHOT_SPEED;
      b.x += b.vx;
      b.y += b.vy;
      // shot down
      for (let j = 0; j < bullets.length; j++) {
        const s = bullets[j];
        if (!s.live) continue;
        if (Math.abs(s.x - b.x) < 4 * DIFFICULTY.HITBOX_TARGET && Math.abs(s.y - b.y) < 5 * DIFFICULTY.HITBOX_TARGET) {
          s.live = false;
          b.live = false;
          score += 200;
          burst(b.x, b.y, C.warning, 10, 1.8, 16);
          SFX.pop();
          break;
        }
      }
      if (!b.live) continue;
      if (b.y >= GROUND_Y - 2) bombImpact(b);
    }

    // bullets vs rocks
    for (let i = 0; i < rocks.length; i++) {
      const r = rocks[i];
      if (!r.live) continue;
      for (let j = 0; j < bullets.length; j++) {
        const b = bullets[j];
        if (!b.live || b.kind === 1) continue; // vertical shots usually miss ground rocks; allow if low
        if (b.x > r.x - 1 - r.w * (DIFFICULTY.HITBOX_TARGET - 1) && b.x < r.x + r.w + 1 + r.w * (DIFFICULTY.HITBOX_TARGET - 1) && b.y >= GROUND_Y - r.h - 2 - r.h * (DIFFICULTY.HITBOX_TARGET - 1) && b.y < GROUND_Y + 2) {
          b.live = false;
          hitRock(r);
          break;
        }
      }
    }

    // also allow downward? no vertical is upward only. Forward shots hit rocks.

    // particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
    }

    // player collisions
    if (player.live && player.invuln <= 0) {
      const feet = GROUND_Y - player.air;
      const mid = worldX + player.sx + vehCX();
      const fw = worldX + player.sx + vehFront();
      const rw = worldX + player.sx + vehRear();
      // craters: if chassis is near ground and ground under wheels/center is a pit
      if (player.air < 3) {
        const gyM = groundYAt(mid);
        const gyF = groundYAt(fw);
        const gyR = groundYAt(rw);
        const cEase = 1 / DIFFICULTY.HITBOX_HURT;
        if (gyM > GROUND_Y + 5 * cEase && gyF > GROUND_Y + 4 * cEase && gyR > GROUND_Y + 4 * cEase) {
          killPlayer("crater");
        } else if (player.air < 1 && (gyM > GROUND_Y + 7 * cEase)) {
          killPlayer("crater");
        }
      }
      // rocks
      for (let i = 0; i < rocks.length; i++) {
        const r = rocks[i];
        if (!r.live) continue;
        const [rx0, rx1] = hurtRangeX(6, 4);
        if (rx0 < r.x + r.w && rx1 > r.x && feet > GROUND_Y - r.h * DIFFICULTY.HITBOX_HURT + 1) {
          killPlayer("rock");
          r.live = false;
          burst(r.x + 4, GROUND_Y - 4, C.rock[3], 8, 2, 16);
          break;
        }
      }
      // bombs vs player
      for (let i = 0; i < bombs.length; i++) {
        const b = bombs[i];
        if (!b.live) continue;
        const [bx0, bx1] = hurtRangeX(4, 4);
        if (b.x > bx0 && b.x < bx1 && b.y > feet - S(28) * DIFFICULTY.HITBOX_HURT && b.y < feet + 2 * DIFFICULTY.HITBOX_HURT) {
          b.live = false;
          killPlayer("bomb");
          burst(b.x, b.y, C.warning, 10, 2, 16);
          break;
        }
      }
      // ufo contact
      for (let i = 0; i < ufos.length; i++) {
        const u = ufos[i];
        if (!u.live) continue;
        const [ux0, ux1] = hurtRangeX(6, 6);
        const py = feet - S(16);
        if (u.x + u.w > ux0 && u.x < ux1 && u.y + u.h > py - 10 * DIFFICULTY.HITBOX_HURT && u.y < py + 8 * DIFFICULTY.HITBOX_HURT) {
          hitUfo(u);
          killPlayer("ufo");
          break;
        }
      }
    }

    cullWorld();
    if (hintTimer > 0) hintTimer--;
    if (thrustHintTimer > 0) thrustHintTimer--;
    if (shake > 0) shake *= 0.85;
    if (flash > 0) flash--;
  }

  function updateDying() {
    player.air = Math.max(0, player.air - 0.4);
    updateSuspension(false);
    worldX += player.speed * 0.2;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
    }
    if (shake > 0) shake *= 0.9;
    if (flash > 0) flash--;
    deathTimer--;
    if (deathTimer <= 0) respawnOrOver();
  }

  function updateTitle() {
    // Slow parallax drift, truck parked with a living suspension bob. No obstacles on the title screen.
    player.speed = 0.45;
    player.sx = 48;
    player.air = 0;
    player.onGround = true;
    worldX += 0.45;
    // Title is a showcase only; do not wipe the Level 2 intro's course
    // (that was dropping all 5 numbered checkpoints before play began).
    if (mode === "title") {
      craters = [];
      rocks = [];
      ufos = [];
      bombs = [];
      bullets = [];
      checkpoints = [];
    }
    updateSuspension(false);
    if (frame % 160 === 50) {
      player.frontSV += 1.8;
      player.rearSV += 1.3;
    }
  }

  /* ---------------- render ---------------- */
  function drawHud(g) {
    fillRect(g, 0, 0, IW, 14, "#000");
    drawText(g, "SCORE " + String(Math.floor(score)).padStart(6, "0"), 4, 3, C.hud, 1);
    drawText(g, "POINT " + destPoint, 132, 3, C.accent, 1);
    const tcol = timeLeft <= 10 ? C.danger : (timeLeft <= 20 ? C.warning : C.hud);
    const ts = Math.max(0, Math.ceil(timeLeft));
    drawText(g, "TIME " + String(ts).padStart(2, "0"), 180, 3, tcol, 1);
    drawText(g, "LIVES", 236, 3, C.hudDim, 1);
    for (let i = 0; i < MAX_LIVES; i++) {
      const x = 274 + i * 29;
      const on = i < lives;
      const body = on ? C.steelHi : C.steelDk;
      const win = on ? C.window : "#101418";
      const tire = on ? C.tire : C.steelDk;
      const lite = on ? C.light : C.steelDk;
      if (level === 2) {
        // 22x7 roadster icon (10% smaller than the previous 24x8)
        const glass = on ? C.goldGlass : "#101418";
        fillRect(g, x + 6, 8, 18, 3, on ? C.ano : C.steelDk);
        fillRect(g, x + 11, 6, 7, 3, on ? C.ano : C.steelDk);
        fillRect(g, x + 13, 7, 6, 1, glass);
        fillRect(g, x + 12, 7, 1, 1, glass);
        fillRect(g, x + 24, 9, 2, 2, lite);
        fillRect(g, x + 5, 9, 1, 2, on ? C.tail : C.steelDk);
        fillRect(g, x + 9, 10, 3, 2, tire);
        fillRect(g, x + 19, 10, 3, 2, tire);
      } else {
      // 27x10 icon, facing right, 10% smaller than the previous 30x11
      fillRect(g, x + 1, 6, 9, 4, body);
      fillRect(g, x + 9, 4, 6, 5, body);
      fillRect(g, x + 14, 5, 9, 5, body);
      fillRect(g, x + 22, 7, 4, 3, body);
      fillRect(g, x + 10, 6, 4, 2, win);
      fillRect(g, x + 15, 6, 5, 2, win);
      fillRect(g, x + 26, 7, 1, 2, lite);
      fillRect(g, x, 8, 1, 2, on ? C.tail : C.steelDk);
      fillRect(g, x + 4, 9, 4, 2, tire);
      fillRect(g, x + 7, 10, 1, 1, on ? C.rim : C.steelDk);
      fillRect(g, x + 19, 9, 4, 2, tire);
      fillRect(g, x + 20, 10, 1, 1, on ? C.rim : C.steelDk);
      }
    }
    if (SFX.muted) drawText(g, "MUTE", IW - 28, 15, C.hudDim, 1, "left");

    // speed bar
    const sp = (player.speed - player.minSpeed) / (player.maxSpeed - player.minSpeed);
    fillRect(g, 4, 15, 40, 3, C.steelDk);
    fillRect(g, 4, 15, Math.round(40 * sp), 3, C.accent);
    drawText(g, "SPD", 46, 13, C.hudDim, 1);

    if (level === 2) {
      const tmax = L2_THRUST;
      const frac = tmax > 0 ? Math.max(0, thrustTime / tmax) : 0;
      const low = thrustTime <= 4;
      const flashLow = low && (frame % 16 < 8);
      const barCol = thrustOn && thrustTime > 0 ? C.light : (low ? C.danger : C.accent);
      const labelCol = flashLow ? C.danger : (low ? C.warning : C.hudDim);
      // Second HUD row, right of SPD, clear of TIME / LIVES
      drawText(g, "THRUST", 80, 13, labelCol, 1);
      fillRect(g, 128, 15, 50, 3, C.steelDk);
      fillRect(g, 128, 15, Math.round(50 * frac), 3, flashLow ? C.danger : barCol);
      const sec = Math.ceil(Math.max(0, thrustTime));
      drawText(g, String(sec).padStart(2, "0"), 182, 13, labelCol, 1);
    }

    if (mode === "playing" && hintTimer > 0 && (hintTimer > 60 || (frame % 20 < 14))) {
      const hint = level === 2
        ? "ARROWS SPEED   UP/SPACE JUMP   T/DOWN THRUST   Z/X/F FIRE"
        : "ARROWS SPEED   UP/SPACE JUMP   Z/X/F FIRE   M MUTE";
      drawTextShadow(g, hint, IW / 2, 22, C.hud, 1, "center");
    }
    if (mode === "playing" && level === 2 && thrustHintTimer > 0 && (thrustHintTimer > 50 || (frame % 20 < 14))) {
      drawTextShadow(g, "PRESS T FOR THRUSTERS", IW / 2, 44, C.warning, 1, "center", "#101018");
    }
  }

  let sceneOx = 0, sceneOy = 0;

  function drawScene(g) {
    let ox = 0, oy = 0;
    if (shake > 0.2) {
      ox = Math.round((Math.random() - 0.5) * shake);
      oy = Math.round((Math.random() - 0.5) * shake);
    }
    sceneOx = ox;
    sceneOy = oy;
    g.save();
    g.translate(ox, oy);

    const P = (level === 2 ? PAL_L2 : PAL_L1);
    fillRect(g, -8, -8, IW + 16, IH + 16, C.sky);
    drawStars(g);
    drawMtnLayer(g, worldX * 0.15, 108, 22, P.far, P.farHi, 11, 0);
    drawMtnLayer(g, worldX * 0.32, 124, 26, P.mid, P.midHi, 27, 1.4);
    drawMtnLayer(g, worldX * 0.55, 142, 18, P.near, P.nearHi, 43, 0.8);
    drawCity(g, worldX * 0.7, 154, P.city);
    fillRect(g, 0, 154, IW, GROUND_Y - 154, P.haze);
    fillRect(g, 0, 158, IW, GROUND_Y - 158, P.band);

    drawGround(g);

    for (let i = 0; i < checkpoints.length; i++) drawCheckpoint(g, checkpoints[i]);
    for (let i = 0; i < rocks.length; i++) drawRock(g, rocks[i]);

    // bombs / fireballs
    for (let i = 0; i < bombs.length; i++) {
      const b = bombs[i];
      if (!b.live) continue;
      if (b.kind === "fireball") {
        drawFireball(g, b);
      } else {
        const sx = Math.round(b.x - worldX), sy = Math.round(b.y);
        fillRect(g, sx - 1, sy - 3, 3, 3, frame % 6 < 3 ? C.warning : C.danger);
        fillRect(g, sx, sy, 1, 2, C.hud);
      }
    }

    // bullets
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      if (!b.live) continue;
      const sx = Math.round(b.x - worldX), sy = Math.round(b.y);
      if (b.kind === 0) {
        fillRect(g, sx, sy, 4, 2, C.shot2);
        fillRect(g, sx + 2, sy, 3, 2, C.shot);
      } else {
        fillRect(g, sx, sy, 2, 4, C.shot2);
        fillRect(g, sx, sy, 2, 2, C.shot);
      }
    }

    for (let i = 0; i < ufos.length; i++) if (ufos[i].live) drawUfo(g, ufos[i]);

    const blink = player.invuln > 0 && (frame % 8 < 4);
    if (mode !== "gameover") {
      drawPlayerVehicle(g, Math.round(player.sx), GROUND_Y, {
        air: player.air,
        frontS: player.frontS,
        rearS: player.rearS,
        pitch: player.pitch,
        muzzle: player.muzzle,
        blink: mode === "dying" || blink,
        dead: mode === "dying",
        onGround: player.onGround,
        thrust: level === 2 && thrustOn && thrustTime > 0 && player.live
      });
    }

    // particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.life <= 0) continue;
      const sx = Math.round(p.x - worldX), sy = Math.round(p.y);
      g.globalAlpha = Math.max(0, p.life / p.max);
      fillRect(g, sx, sy, p.size, p.size, p.color);
      g.globalAlpha = 1;
    }

    g.restore();

    if (flash > 0) {
      g.fillStyle = "rgba(255,220,160," + (0.12 * flash) + ")";
      g.fillRect(0, 0, IW, IH);
    }
  }

  function drawTitleOverlay(g) {
    drawTextShadow(g, "CYBER PATROL", IW / 2, 28, C.steelHi, 3, "center", "#10141c");
    drawText(g, "CYBER PATROL", IW / 2, 27, C.light, 3, "center");
    drawTextShadow(g, "A MOON-PATROL STYLE ARCADE GAME", IW / 2, 54, C.accent, 1, "center");

    fillRect(g, 70, 68, 244, 54, "rgba(0,0,0,0.45)");
    drawText(g, "LEFT / RIGHT   SPEED", IW / 2, 72, C.hud, 1, "center");
    drawText(g, "UP / SPACE     JUMP", IW / 2, 82, C.hud, 1, "center");
    drawText(g, "Z  X  F  CTRL  FIRE", IW / 2, 92, C.hud, 1, "center");
    drawText(g, "M MUTE    P PAUSE", IW / 2, 102, C.hudDim, 1, "center");

    const enterCol = (frame % 40 < 20) ? C.warning : C.hud;
    drawTextShadow(g, "PRESS ENTER", IW / 2, 128, enterCol, 2, "center");
    drawText(g, "CLEAR THE SECTORS TO REACH THE SHIP", IW / 2, 198, C.hudDim, 1, "center");
    drawText(g, "2 OR ?level=2 FOR LEVEL 2    E OR ?ending=1 FOR THE ENDING", IW / 2, 208, C.hudDim, 1, "center");
  }

  function drawCenterPanel(g, title, sub, flashLine) {
    fillRect(g, 70, 70, 244, 70, "rgba(0,0,0,0.7)");
    fillRect(g, 70, 70, 244, 1, C.accent);
    fillRect(g, 70, 139, 244, 1, C.accent);
    drawTextShadow(g, title, IW / 2, 82, C.hud, 2, "center");
    if (sub) drawText(g, sub, IW / 2, 104, C.accent, 1, "center");
    if (!flashLine || frame % 40 < 26) {
      drawText(g, flashLine || "PRESS ENTER", IW / 2, 118, C.warning, 1, "center");
    }
  }

  function render() {
    ctx.imageSmoothingEnabled = false;
    if (mode === "win") {
      drawEndingScene(ctx);
    } else if (mode === "title") {
      // generate enough scenery on first title frames
      drawScene(ctx);
      drawTitleOverlay(ctx);
    } else {
      drawScene(ctx);
      drawHud(ctx);
      if (mode === "pause") {
        drawCenterPanel(ctx, "PAUSED", "M MUTE", "PRESS P OR ENTER");
      } else if (mode === "gameover") {
        drawCenterPanel(ctx, "GAME OVER", "SCORE " + Math.floor(score), "PRESS ENTER");
      } else if (mode === "win") {
        // ending tableau is the whole scene (drawn in the branch below via drawEndingScene)
      } else if (mode === "levelintro") {
        drawCenterPanel(ctx, "LEVEL 2", "ROADSTER  T/DOWN THRUSTERS", "GET READY");
      }
    }

    vctx.imageSmoothingEnabled = false;
    vctx.fillStyle = "#000";
    vctx.fillRect(0, 0, view.width, view.height);
    vctx.drawImage(game, 0, 0, view.width, view.height);
    drawHeadsOnView();
  }

  /* ---------------- loop ---------------- */
  let acc = 0, last = 0;
  const STEP = 1000 / 60;

  function beginLevel(n, keepScore) {
    level = n;
    resetCourse(!!keepScore);
    thrustOn = false;
    thrustTime = (level === 2 ? L2_THRUST : 0);
    hintTimer = 240;
    // Always show the Level 2 intro (Roadster reveal), including ?level=2 / key 2.
    if (level === 2) {
      mode = "levelintro";
      introTimer = 150;
      player.speed = player.defaultSpeed;
    } else {
      mode = "playing";
    }
    if (keepScore) SFX.startMusic(0.15);
  }

  function startEnding() {
    level = 2;
    mode = "win";
    endingTimer = 0;
    endingCarX = -56;
    endingParked = false;
    thrustOn = false;
    player.air = 0;
    player.onGround = true;
    player.live = true;
    player.speed = 0.9;
    player.frontS = 0;
    player.rearS = 0;
    hintTimer = 0;
    SFX.ensure();
    SFX.win();
  }

  function startGame() {
    SFX.ensure();
    SFX.start();
    const n = (wantedLevel === 2 ? 2 : 1);
    wantedLevel = 1;
    beginLevel(n, false);
    SFX.startMusic(0.35);
  }

  function tick(dt) {
    collectInput();
    if (input.mutePress) SFX.toggle();

    if (mode === "title") {
      updateTitle();
      if (input.startPress || input.jumpPress) {
        startGame();
        if (wantedHead) seedHeadDemo();
      }
      if (input.level2Press) {
        wantedLevel = 2;
        startGame();
        if (wantedHead) seedHeadDemo();
      }
      if (input.endingPress) startEnding();
    } else if (mode === "levelintro") {
      updateTitle(); // parked bob, no obstacles already cleared on reset
      player.speed = 0.45;
      introTimer--;
      if (introTimer <= 0 || input.startPress || input.jumpPress) {
        player.speed = player.defaultSpeed;
        mode = "playing";
      }
    } else if (mode === "playing") {
      if (input.pausePress) { resumeMode = mode; mode = "pause"; }
      else updatePlaying();
    } else if (mode === "pause") {
      if (input.pausePress || input.startPress) mode = resumeMode;
    } else if (mode === "dying") {
      updateDying();
    } else if (mode === "gameover") {
      if (input.startPress || input.jumpPress) {
        wantedLevel = 1;
        startGame();
      }
    } else if (mode === "win") {
      endingTimer++;
      if (!endingParked) {
        endingCarX += 1.15;
        if (endingCarX >= 92) {
          endingCarX = 92;
          endingParked = true;
          player.speed = 0.4;
        }
      } else if (endingTimer % 80 === 40) {
        player.frontSV = 1.4;
        player.rearSV = 1.0;
      }
      // light suspension bob on the parked (or rolling) roadster
      player.frontSV += -0.28 * player.frontS;
      player.rearSV += -0.28 * player.rearS;
      player.frontSV *= 0.82;
      player.rearSV *= 0.82;
      player.frontS += player.frontSV;
      player.rearS += player.rearSV;
      if (input.startPress || input.jumpPress) {
        endingParked = false;
        wantedLevel = 1;
        startGame();
      }
    }
    SFX.setPlaying(mode === "playing" || mode === "levelintro");
    frame++;
  }

  function loop(now) {
    if (!last) last = now;
    acc += Math.min(64, now - last);
    last = now;
    while (acc >= STEP) {
      tick(STEP / 1000);
      acc -= STEP;
    }
    render();
    requestAnimationFrame(loop);
  }

  // init title world
  resetCourse(false);
  mode = "title";
  player.speed = 0.55;
  generateUntil(worldX + IW + 400);
  function seedHeadDemo() {
    ufos.length = 0;
    bombs.length = 0;
    // keep the vehicle on screen for the verification shot
    craters.forEach((c) => { if (c.x < worldX + 520) c.live = false; });
    rocks.forEach((r) => { if (r.x < worldX + 520) r.live = false; });
    spawnUfo(0, "head");
    const u = ufos[0];
    u.x = worldX + 200;
    u.y = 36;
    u.vx = -0.35;
    u.bombCd = 10000;
    player.invuln = 999;
    headSpawned = true;
    bombs.push({
      x: u.x + u.w * HEAD_MOUTH_X,
      y: 84,
      vx: -0.05,
      vy: 0.22,
      live: true,
      kind: "fireball"
    });
  }

  if (wantedEnding) startEnding();

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
